<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f5a"/>
      <stop offset=".45" stop-color="#e93d9a"/>
      <stop offset="1" stop-color="#533afd"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#f45fd9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f45fd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".95" cy=".95" r=".5">
      <stop offset="0" stop-color="#7fd3ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7fd3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <g transform="translate(90 96)">
    <rect width="108" height="108" rx="30" fill="url(#mark)"/>
    <rect x="27" y="30" width="54" height="10" rx="5" fill="#fff"/>
    <rect x="35.5" y="49" width="37" height="10" rx="5" fill="#fff" opacity=".92"/>
    <rect x="44" y="68" width="20" height="10" rx="5" fill="#fff" opacity=".84"/>
  </g>

  <text x="232" y="168" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="78" font-weight="600" fill="#0d253d" letter-spacing="-2">Seekr</text>
  <text x="236" y="212" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#3c4f69">Realtime search — results arrive as you type.</text>

  <g transform="translate(760 104)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <rect width="360" height="56" rx="28" fill="#fff" stroke="#533afd" stroke-width="2"/>
    <circle cx="34" cy="26" r="9" fill="none" stroke="#5d6d85" stroke-width="2.5"/>
    <line x1="41" y1="33" x2="48" y2="40" stroke="#5d6d85" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="35" font-size="20" fill="#0d253d">chennai metro ph</text>
    <rect x="228" y="17" width="2" height="22" fill="#533afd"/>
    <rect x="0" y="72" width="360" height="3" rx="1.5" fill="#e3e8ee"/>
    <rect x="0" y="72" width="210" height="3" rx="1.5" fill="#533afd"/>
    <text x="360" y="100" font-size="15" fill="#5d6d85" text-anchor="end" font-family="'IBM Plex Mono', Consolas, monospace">142 ms</text>
  </g>
